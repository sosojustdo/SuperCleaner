apply plugin: 'com.android.application'

android {
    compileSdkVersion 'android-P'
    buildToolsVersion '27.0.0'
    lintOptions {
        abortOnError false
    }
    lintOptions { checkReleaseBuilds false }
    android {
        lintOptions { disable 'MissingTranslation', 'ExtraTranslation' }
    }
    defaultConfig {
        applicationId "com.superbooster.cleanup"
        minSdkVersion 16
        targetSdkVersion 27
        versionCode 4
        versionName "4.0"
        multiDexEnabled true
        javaCompileOptions {
            annotationProcessorOptions {
                includeCompileClasspath true
            }
        }
    }
    repositories {
        flatDir {
            dirs 'libs'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        packagingOptions {
            exclude 'META-INF/services/javax.annotation.processing.Processor'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'x86', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }
}

dependencies {
    compile fileTree(include: ['*.jar'], dir: 'libs')
    compile project(':library')
    compile files('libs/nineoldandroids-2.4.0.jar')
    //compile files('libs/umeng-update-v2.5.0.jar')
    //compile 'com.umeng.analytics:analytics:latest.integration'
    //compile files('libs/umeng_social_sdk.jar')
    compile files('libs/httpmime-4.1.3.jar')
    compile files('libs/SocialSDK_laiwang_1.jar')
    compile files('libs/SocialSDK_laiwang_2.jar')
    compile files('libs/SocialSDK_QQZone_1.jar')
    compile 'eu.chainfire:libsuperuser:1.0.0.+'
    compile 'com.jakewharton:butterknife:6.0.0'
    compile 'com.nhaarman.listviewanimations:lib-core:3.1.0@aar'
    compile 'com.nhaarman.listviewanimations:lib-manipulation:3.1.0@aar'
    compile 'com.nhaarman.listviewanimations:lib-core-slh:3.1.0@aar'
    compile 'com.github.gabrielemariotti.changeloglib:library:1.5.2'
    compile 'com.hannesdorfmann.smoothprogressbar:library:1.0.0'
    compile 'com.github.castorflex.smoothprogressbar:library-circular:1.0.0'
    compile 'org.greenrobot:eventbus:3.0.0'
    compile 'com.android.support.constraint:constraint-layout:1.0.2'
    //compile 'com.android.support:appcompat-v7:28.0.0-alpha1'
    compile 'com.github.ybq:Android-SpinKit:1.0.4'
    compile 'com.mylhyl:acp:1.1.7'
    compile(name: 'AudienceNetwork', ext: 'aar')
    compile 'com.applovin:applovin-sdk:9.2.0'
    compile 'com.facebook.android:facebook-android-sdk:[4,5)'
    implementation 'com.android.support:appcompat-v7:28.0.0-alpha1'
    implementation 'com.google.android.gms:play-services-ads:17.1.2'
}


apply plugin: 'com.google.gms.google-services'